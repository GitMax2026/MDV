<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDV Studio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HERO -->
    <header class="hero">
        <img src="./LOGO.svg" alt="MDV Logo" class="logo">
        <h1>MDV Studio</h1>
        <p>Graphic & Web Design</p>
    </header>

    <!-- BENTO GRID -->
    <div class="bento-grid">

        <div class="bento-card">
            <div class="bento-content">
                <h3>Approccio Moderno</h3>
                <p>Design pulito, leggibile e orientato alla conversione.</p>
            </div>
            <div class="bento-image">
                <img src="./foto-approccio.png" alt="Approccio Moderno">
            </div>
        </div>

        <div class="bento-card">
            <div class="bento-content">
                <h3>Design System</h3>
                <p>Coerenza visiva e identità professionale.</p>
            </div>
            <div class="bento-image">
                <img src="./foto-design-system.png" alt="Design System">
            </div>
        </div>

        <div class="bento-card">
            <div class="bento-content">
                <h3>Siti Statici Veloci</h3>
                <p>Pagine leggere, sicure e istantanee nel caricamento.</p>
            </div>
            <div class="bento-image">
                <img src="./foto-siti-veloci.png" alt="Siti Statici Veloci">
            </div>
        </div>

    </div>

    <!-- FOOTER ORIGINALE (solo migliorato nel form) -->
    <footer>

        <div class="footer-social">
            <h4>Seguimi</h4>
            <div class="socials">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">LinkedIn</a>
                <a href="#">Behance</a>
            </div>
        </div>

        <div class="footer-contact">
            <h4>Contattami</h4>

            <form action="https://formspree.io/f/mgaeqryw" method="POST" class="contact-form">
                <input type="text" name="nome" placeholder="Il tuo nome" required>
                <input type="email" name="email" placeholder="La tua email" required>

                <!-- TEXTAREA modificata -->
                <textarea name="messaggio" placeholder="Il tuo messaggio..." required></textarea>

                <button type="submit" class="btn-contact">Invia</button>
            </form>
        </div>

    </footer>

</div>

</body>
</html>
